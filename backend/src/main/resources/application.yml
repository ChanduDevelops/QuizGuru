server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: quizguru-backend
  config:
    import: "optional:file:backend/.env[.properties],optional:file:.env[.properties]"
  mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/quizguru}
      auto-index-creation: false

app:
  admin:
    email: ${APP_ADMIN_EMAIL:admin@gmail.com}
  jwt:
    secret: ${JWT_SECRET:UXVpekd1cnVFbnRlcnByaXNlU2VjcmV0S2V5Rm9ySldUQXV0aGVudGljYXRpb24yMDI2IQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.quizguru: INFO
    org.springframework.security: WARN
